          format: uuid
        clientId:
          type: string
        clientName:
          type: string
        grantTypes:
          type: string
        redirectUris:
          type: string
        scopes:
          type: string
        accessTokenValidity:
          type: integer
          format: int32
        refreshTokenValidity:
          type: integer
          format: int32
        autoApprove:
          type: boolean
        status:
          type: integer
          format: int32
        createdAt:
          type: string
          format: date-time
        updatedAt:
