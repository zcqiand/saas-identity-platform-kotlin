components:
  schemas:
    AuthorizeCodeRequest:
      type: object
      required:
        - clientId
        - redirectUri
        - responseType
        - state
      properties:
        clientId:
          type: string
        redirectUri:
          type: string
          minLength: 1
          maxLength: 500
        responseType:
          type: string
          enum:
            - code
        scope:
          type: string
        state:
          type: string
    CreateOAuthClientRequest:
      type: object
      required:
        - clientId
        - clientName
        - clientSecret
        - grantTypes
        - redirectUris
      properties:
        clientId:
          type: string
        clientName:
          type: string
        clientSecret:
          type: string
        grantTypes:
          type: string
        redirectUris:
          type: string
        scopes:
          type: string
        accessTokenValidity:
          type: integer
          format: int32
        refreshTokenValidity:
          type: integer
          format: int32
        autoApprove:
          type: boolean
    CreateSysMenuRequest:
      type: object
      required:
        - title
        - type
      properties:
        parentId:
          type: string
          format: uuid
        title:
          type: string
        type:
          $ref: '#/components/schemas/SysMenuType'
        path:
          type: string
        component:
          type: string
        perms:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
          format: int32
    CreateSysRoleRequest:
      type: object
      required:
        - clientId
        - roleCode
        - roleName
      properties:
        clientId:
          type: string
        roleCode:
          type: string
          minLength: 1
          maxLength: 64
        roleName:
          type: string
          minLength: 1
          maxLength: 64
        description:
          type: string
        isPreset:
          type: boolean
    CreateSysUserRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 8
          maxLength: 256
        email:
          type: string
          format: email
        mobile:
          type: string
    CreateTenantRequest:
      type: object
      required:
        - tenantKey
        - name
      properties:
        tenantKey:
          type: string
          minLength: 2
          maxLength: 64
        name:
          type: string
          minLength: 2
          maxLength: 128
    CurrentUser:
      type: object
      required:
        - id
        - memberships
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        memberships:
          type: array
          items:
            $ref: '#/components/schemas/TenantMembership'
        currentTenantId:
          type: string
          format: uuid
    EffectiveMenuNode:
      type: object
      required:
        - id
        - clientId
        - parentId
        - title
        - type
        - sortOrder
        - children
      properties:
        id:
          type: string
          format: uuid
        clientId:
          type: string
        parentId:
          type: string
          nullable: true
          format: uuid
        title:
          type: string
        type:
          $ref: '#/components/schemas/SysMenuType'
        path:
          type: string
        component:
          type: string
        perms:
          type: string
        icon:
          type: string
        sortOrder:
          type: integer
          format: int32
        children:
          type: array
          items:
            $ref: '#/components/schemas/EffectiveMenuNode'
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
        details:
          type: object
          additionalProperties: {}
    LockedAccountResponse:
      type: object
      required:
        - code
        - message
        - lockedUntil
      properties:
        code:
          type: string
          example: ACCOUNT_LOCKED
        message:
          type: string
        lockedUntil:
          type: string
          format: date-time
        remainingAttempts:
          type: integer
          format: int32
    LoginRequest:
      type: object
      required:
        - username
        - password
        - clientId
      properties:
        username:
          type: string
          minLength: 1
          maxLength: 64
        password:
          type: string
          minLength: 1
          maxLength: 128
        clientId:
          type: string
    LoginResponse:
      type: object
      required:
        - user
        - availableTenants
        - userId
        - clientId
      properties:
        user:
          $ref: '#/components/schemas/SysUser'
        availableTenants:
          type: array
          items:
            $ref: '#/components/schemas/TenantMembership'
        userId:
          type: string
          format: uuid
        currentTenantId:
          type: string
          format: uuid
        accessToken:
          type: string
        refreshToken:
          type: string
        tokenType:
          type: string
        expiresIn:
          type: integer
          format: int32
        clientId:
          type: string
